<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>صيدلية الحناوي | Elhenawy Pharmacy</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Cairo:wght@300;400;600;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --gold:      #c9a84c;
    --gold-lt:   #f0d080;
    --gold-dk:   #8a6820;
    --gold-dim:  rgba(201,168,76,.35);
    --dark:      #09090700;
    --dark-bg:   #0b0b09;
  }

  html, body { min-height: 100%; background: var(--dark-bg); font-family: 'Cairo', sans-serif; overflow-x: hidden; }

  /* ── BACKGROUNDS ── */
  .bg {
    position: fixed; inset: 0; z-index: 0;
  }
  .bg-photo {
    position: absolute; inset: 0;
    background: url('YOUR_BACKGROUND_IMAGE_HERE') center/cover no-repeat;
    opacity: .17;
  }
  .bg-grid {
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(45deg,  transparent, transparent 55px, rgba(201,168,76,.035) 55px, rgba(201,168,76,.035) 56px),
      repeating-linear-gradient(-45deg, transparent, transparent 55px, rgba(201,168,76,.035) 55px, rgba(201,168,76,.035) 56px);
  }
  .bg-glow {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 65% 55% at 12% 22%, rgba(201,168,76,.13) 0%, transparent 70%),
      radial-gradient(ellipse 55% 65% at 88% 80%, rgba(201,168,76,.09) 0%, transparent 70%);
  }
  .bg-vignette {
    position: absolute; inset: 0;
    background: linear-gradient(to bottom,
      rgba(11,11,9,.7) 0%,
      rgba(11,11,9,.22) 30%,
      rgba(11,11,9,.22) 70%,
      rgba(11,11,9,.82) 100%);
  }

  /* ── LAYOUT ── */
  .page {
    position: relative; z-index: 1;
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 56px 24px;
  }

  /* ── TOP NEEDLE ── */
  .needle {
    display: flex; flex-direction: column; align-items: center;
    gap: 8px; margin-bottom: 30px;
    opacity: 0; animation: up .6s ease .05s forwards;
  }
  .needle-line { width: 1px; height: 44px; background: linear-gradient(to bottom, transparent, var(--gold)); }
  .needle-dot  { width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); box-shadow: 0 0 10px rgba(201,168,76,.6); }

  /* ── LOGO ── */
  .logo-wrap {
    width: clamp(110px, 25vw, 185px);
    height: clamp(110px, 25vw, 185px);
    margin-bottom: 26px;
    opacity: 0; animation: up .8s ease .2s forwards;
    filter: drop-shadow(0 0 28px rgba(201,168,76,.22));
  }
  .logo-wrap img { width: 100%; height: 100%; object-fit: contain; }

  /* ── NAME BLOCK ── */
  .name-block {
    display: flex; flex-direction: column; align-items: center; gap: 5px;
    opacity: 0; animation: up .75s ease .38s forwards;
  }
  .name-tag {
    font-size: 10px; font-weight: 300; letter-spacing: 4px;
    color: var(--gold); text-transform: uppercase; opacity: .7;
  }
  .name-ar {
    font-family: 'Cairo', sans-serif;
    font-size: clamp(36px, 9vw, 76px);
    font-weight: 700;
    color: var(--gold-lt);
    line-height: 1.05;
    letter-spacing: 2px;
    text-shadow: 0 0 60px rgba(201,168,76,.28);
  }
  .name-divider {
    width: 40px; height: 1px;
    background: linear-gradient(to right, transparent, var(--gold), transparent);
    margin: 3px 0;
  }
  .name-en {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(15px, 3.5vw, 26px);
    font-weight: 600;
    letter-spacing: 5px;
    color: var(--gold);
    text-transform: uppercase;
  }

  /* ── ORNAMENTAL DIVIDER ── */
  .ornament {
    display: flex; align-items: center; gap: 12px;
    width: 100%; max-width: 340px;
    margin: 26px 0;
    opacity: 0; animation: up .7s ease .54s forwards;
  }
  .orn-line {
    flex: 1; height: .5px;
    background: linear-gradient(to left, transparent, var(--gold-dim));
  }
  .orn-line.r { background: linear-gradient(to right, transparent, var(--gold-dim)); }
  .orn-dots { display: flex; gap: 4px; align-items: center; }
  .orn-dots span {
    display: block; background: var(--gold); transform: rotate(45deg);
  }
  .orn-dots span:nth-child(1),
  .orn-dots span:nth-child(3) { width: 4px; height: 4px; opacity: .45; }
  .orn-dots span:nth-child(2) { width: 6px; height: 6px; }

  /* ── TAGLINE ── */
  .tagline {
    font-size: 12px; font-weight: 300;
    letter-spacing: 2.5px; color: rgba(240,208,128,.6);
    margin-bottom: 40px; text-align: center;
    opacity: 0; animation: up .7s ease .65s forwards;
  }

  /* ── SOCIAL BUTTONS ── */
  .links {
    display: flex; flex-direction: column; gap: 13px;
    width: 100%; max-width: 410px;
    opacity: 0; animation: up .8s ease .8s forwards;
  }
  .btn {
    display: flex; align-items: center; gap: 16px;
    padding: 14px 22px;
    border: .5px solid rgba(201,168,76,.18);
    border-radius: 2px;
    background: rgba(11,11,9,.52);
    backdrop-filter: blur(14px);
    text-decoration: none;
    position: relative; overflow: hidden;
    transition: border-color .28s, transform .28s;
  }
  .btn::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(201,168,76,.07) 0%, transparent 60%);
    opacity: 0; transition: opacity .28s;
  }
  .btn:hover { border-color: rgba(201,168,76,.5); transform: translateX(-4px); }
  .btn:hover::before { opacity: 1; }
  .btn:active { transform: translateX(-2px) scale(.99); }

  .btn-icon {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .btn-icon svg { width: 22px; height: 22px; }
  .btn.fb .btn-icon { background: rgba(24,119,242,.13); border: .5px solid rgba(24,119,242,.3); }
  .btn.ig .btn-icon { background: rgba(225,48,108,.11); border: .5px solid rgba(225,48,108,.3); }
  .btn.wa .btn-icon { background: rgba(37,211,102,.11); border: .5px solid rgba(37,211,102,.3); }

  .btn-text { flex: 1; min-width: 0; }
  .btn-sub {
    display: block; font-size: 9px; font-weight: 300;
    letter-spacing: 2.5px; text-transform: uppercase;
    color: rgba(201,168,76,.45); margin-bottom: 2px;
  }
  .btn-title {
    display: block; font-size: 15px; font-weight: 600;
    color: var(--gold-lt); letter-spacing: 1px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .btn-arrow {
    color: var(--gold); opacity: .35; font-size: 19px;
    flex-shrink: 0; transition: opacity .25s; font-family: serif;
  }
  .btn:hover .btn-arrow { opacity: 1; }

  /* ── FOOTER ── */
  .footer {
    margin-top: 48px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    opacity: 0; animation: up .7s ease 1s forwards;
  }
  .footer-line { width: 1px; height: 28px; background: linear-gradient(to bottom, var(--gold-dim), transparent); }
  .footer-text { font-size: 9px; letter-spacing: 3px; color: rgba(201,168,76,.28); }

  /* ── ANIMATION ── */
  @keyframes up {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── MOBILE ── */
  @media (max-width: 420px) {
    .page { padding: 36px 16px; }
    .btn-sub { display: none; }
    .btn { gap: 12px; padding: 12px 16px; }
  }
</style>
</head>
<body>
